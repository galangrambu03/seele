name: discord_quest_seele
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  flutter_secure_storage: ^9.0.0
  http: ^1.4.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1 # Tambahkan ini

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
  # Konfigurasi Ikon
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/seele_icon_app.jpg"
  windows:
    generate: true
    image_path: "assets/images/seele_icon_app.jpg"
    icon_size: 256
