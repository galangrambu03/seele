name: Build & Release

on:
  push:
    tags:
      - 'v*' # Akan jalan otomatis jika kamu push tag seperti v1.0.0

permissions:
  contents: write # Dibutuhkan untuk upload ke GitHub Releases

jobs:
  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.50.0'
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build_windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.50.0'
      - run: flutter pub get
      - run: flutter build windows --release
      # Zip folder Windows agar mudah didownload
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath seele-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: seele-windows.zip

  create_release:
    name: Create Release
    needs: [build_android, build_windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android

      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: artifacts/windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/android/app-release.apk
            artifacts/windows/seele-windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}